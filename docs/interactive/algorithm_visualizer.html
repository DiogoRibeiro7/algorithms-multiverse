<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualizer - Algorithms Multiverse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
            font-size: 0.9rem;
        }

        select, input, button {
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .visualization {
            padding: 40px;
            min-height: 400px;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .info-card h3 {
            color: #495057;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .info-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
        }

        .canvas-container {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            min-height: 300px;
            position: relative;
        }

        .array-bar {
            display: inline-block;
            width: 30px;
            margin: 0 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px 4px 0 0;
            transition: all 0.3s;
            position: relative;
        }

        .array-bar.comparing {
            background: #ffc107;
        }

        .array-bar.swapping {
            background: #dc3545;
        }

        .array-bar.sorted {
            background: #28a745;
        }

        .array-bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            font-weight: 600;
            color: #495057;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .code-section {
            background: #f8f9fa;
            padding: 30px;
            border-top: 2px solid #e9ecef;
        }

        .code-section h2 {
            color: #495057;
            margin-bottom: 20px;
        }

        pre {
            background: #282c34;
            color: #abb2bf;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .complexity-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            margin: 5px;
        }

        .complexity-good {
            background: #d4edda;
            color: #155724;
        }

        .complexity-medium {
            background: #fff3cd;
            color: #856404;
        }

        .complexity-bad {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 0;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Algorithm Visualizer</h1>
            <p>Interactive visualization for algorithm understanding</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="algorithm-select">Algorithm</label>
                <select id="algorithm-select">
                    <option value="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="quick">Quick Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="binary-search">Binary Search</option>
                </select>
            </div>

            <div class="control-group">
                <label for="array-size">Array Size</label>
                <input type="number" id="array-size" min="5" max="50" value="15">
            </div>

            <div class="control-group">
                <label for="speed">Animation Speed</label>
                <input type="range" id="speed" min="10" max="1000" value="500">
            </div>

            <div class="control-group">
                <label>&nbsp;</label>
                <button id="generate-btn">Generate Array</button>
            </div>

            <div class="control-group">
                <label>&nbsp;</label>
                <button id="start-btn">Start Visualization</button>
            </div>

            <div class="control-group">
                <label>&nbsp;</label>
                <button id="reset-btn">Reset</button>
            </div>
        </div>

        <div class="visualization">
            <div class="info-panel">
                <div class="info-card">
                    <h3>Comparisons</h3>
                    <div class="value" id="comparisons">0</div>
                </div>
                <div class="info-card">
                    <h3>Swaps</h3>
                    <div class="value" id="swaps">0</div>
                </div>
                <div class="info-card">
                    <h3>Time Complexity</h3>
                    <div class="value" id="time-complexity">O(n²)</div>
                </div>
                <div class="info-card">
                    <h3>Space Complexity</h3>
                    <div class="value" id="space-complexity">O(1)</div>
                </div>
            </div>

            <div class="canvas-container" id="canvas">
                <div id="array-container"></div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>
                    <span>Unsorted</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffc107;"></div>
                    <span>Comparing</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #dc3545;"></div>
                    <span>Swapping</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #28a745;"></div>
                    <span>Sorted</span>
                </div>
            </div>
        </div>

        <div class="code-section">
            <h2>Algorithm Information</h2>
            <div id="algorithm-info">
                <p>Select an algorithm and click "Start Visualization" to see it in action.</p>
            </div>
        </div>
    </div>

    <script>
        class AlgorithmVisualizer {
            constructor() {
                this.array = [];
                this.comparisons = 0;
                this.swaps = 0;
                this.animationSpeed = 500;
                this.isRunning = false;

                this.algorithms = {
                    'bubble': {
                        name: 'Bubble Sort',
                        timeComplexity: 'O(n²)',
                        spaceComplexity: 'O(1)',
                        description: 'Repeatedly steps through the list, compares adjacent elements and swaps them if they are in the wrong order.',
                        code: `function bubbleSort(arr) {
    for (let i = 0; i < arr.length; i++) {
        for (let j = 0; j < arr.length - i - 1; j++) {
            if (arr[j] > arr[j + 1]) {
                [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
            }
        }
    }
    return arr;
}`
                    },
                    'selection': {
                        name: 'Selection Sort',
                        timeComplexity: 'O(n²)',
                        spaceComplexity: 'O(1)',
                        description: 'Divides the list into sorted and unsorted regions, repeatedly selecting the smallest element from the unsorted region.',
                        code: `function selectionSort(arr) {
    for (let i = 0; i < arr.length; i++) {
        let minIdx = i;
        for (let j = i + 1; j < arr.length; j++) {
            if (arr[j] < arr[minIdx]) minIdx = j;
        }
        [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];
    }
    return arr;
}`
                    },
                    'insertion': {
                        name: 'Insertion Sort',
                        timeComplexity: 'O(n²)',
                        spaceComplexity: 'O(1)',
                        description: 'Builds the final sorted array one item at a time, inserting each element into its proper position.',
                        code: `function insertionSort(arr) {
    for (let i = 1; i < arr.length; i++) {
        let key = arr[i];
        let j = i - 1;
        while (j >= 0 && arr[j] > key) {
            arr[j + 1] = arr[j];
            j--;
        }
        arr[j + 1] = key;
    }
    return arr;
}`
                    },
                    'quick': {
                        name: 'Quick Sort',
                        timeComplexity: 'O(n log n)',
                        spaceComplexity: 'O(log n)',
                        description: 'Divides the array into smaller sub-arrays around a pivot, then recursively sorts the sub-arrays.',
                        code: `function quickSort(arr, low = 0, high = arr.length - 1) {
    if (low < high) {
        const pi = partition(arr, low, high);
        quickSort(arr, low, pi - 1);
        quickSort(arr, pi + 1, high);
    }
    return arr;
}`
                    },
                    'merge': {
                        name: 'Merge Sort',
                        timeComplexity: 'O(n log n)',
                        spaceComplexity: 'O(n)',
                        description: 'Divides the array into two halves, recursively sorts them, then merges the sorted halves.',
                        code: `function mergeSort(arr) {
    if (arr.length <= 1) return arr;
    const mid = Math.floor(arr.length / 2);
    const left = mergeSort(arr.slice(0, mid));
    const right = mergeSort(arr.slice(mid));
    return merge(left, right);
}`
                    },
                    'binary-search': {
                        name: 'Binary Search',
                        timeComplexity: 'O(log n)',
                        spaceComplexity: 'O(1)',
                        description: 'Efficiently finds a target value in a sorted array by repeatedly dividing the search interval in half.',
                        code: `function binarySearch(arr, target) {
    let left = 0, right = arr.length - 1;
    while (left <= right) {
        const mid = Math.floor((left + right) / 2);
        if (arr[mid] === target) return mid;
        if (arr[mid] < target) left = mid + 1;
        else right = mid - 1;
    }
    return -1;
}`
                    }
                };

                this.init();
            }

            init() {
                document.getElementById('generate-btn').addEventListener('click', () => this.generateArray());
                document.getElementById('start-btn').addEventListener('click', () => this.start());
                document.getElementById('reset-btn').addEventListener('click', () => this.reset());
                document.getElementById('speed').addEventListener('input', (e) => {
                    this.animationSpeed = 1010 - parseInt(e.target.value);
                });
                document.getElementById('algorithm-select').addEventListener('change', (e) => {
                    this.updateAlgorithmInfo(e.target.value);
                });

                this.generateArray();
                this.updateAlgorithmInfo('bubble');
            }

            generateArray() {
                const size = parseInt(document.getElementById('array-size').value);
                this.array = Array.from({length: size}, () => Math.floor(Math.random() * 100) + 10);
                this.renderArray();
                this.reset();
            }

            renderArray(highlighting = {}) {
                const container = document.getElementById('array-container');
                container.innerHTML = '';
                container.style.display = 'flex';
                container.style.alignItems = 'flex-end';
                container.style.justifyContent = 'center';
                container.style.height = '300px';

                const maxVal = Math.max(...this.array);
                const barWidth = Math.min(50, Math.floor(600 / this.array.length));

                this.array.forEach((value, index) => {
                    const bar = document.createElement('div');
                    bar.className = 'array-bar';
                    bar.style.height = `${(value / maxVal) * 250}px`;
                    bar.style.width = `${barWidth}px`;

                    if (highlighting.comparing && highlighting.comparing.includes(index)) {
                        bar.classList.add('comparing');
                    }
                    if (highlighting.swapping && highlighting.swapping.includes(index)) {
                        bar.classList.add('swapping');
                    }
                    if (highlighting.sorted && highlighting.sorted.includes(index)) {
                        bar.classList.add('sorted');
                    }

                    const valueLabel = document.createElement('span');
                    valueLabel.className = 'array-bar-value';
                    valueLabel.textContent = value;
                    bar.appendChild(valueLabel);

                    container.appendChild(bar);
                });
            }

            async sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async start() {
                if (this.isRunning) return;

                this.isRunning = true;
                document.getElementById('start-btn').disabled = true;

                const algorithm = document.getElementById('algorithm-select').value;

                switch(algorithm) {
                    case 'bubble':
                        await this.bubbleSort();
                        break;
                    case 'selection':
                        await this.selectionSort();
                        break;
                    case 'insertion':
                        await this.insertionSort();
                        break;
                    default:
                        console.log('Algorithm not implemented for visualization');
                }

                this.isRunning = false;
                document.getElementById('start-btn').disabled = false;
            }

            async bubbleSort() {
                const n = this.array.length;
                for (let i = 0; i < n; i++) {
                    for (let j = 0; j < n - i - 1; j++) {
                        this.comparisons++;
                        document.getElementById('comparisons').textContent = this.comparisons;

                        this.renderArray({ comparing: [j, j + 1] });
                        await this.sleep(this.animationSpeed);

                        if (this.array[j] > this.array[j + 1]) {
                            this.swaps++;
                            document.getElementById('swaps').textContent = this.swaps;

                            [this.array[j], this.array[j + 1]] = [this.array[j + 1], this.array[j]];
                            this.renderArray({ swapping: [j, j + 1] });
                            await this.sleep(this.animationSpeed);
                        }
                    }
                    this.renderArray({ sorted: Array.from({length: i + 1}, (_, k) => n - 1 - k) });
                }
                this.renderArray({ sorted: Array.from({length: n}, (_, k) => k) });
            }

            async selectionSort() {
                const n = this.array.length;
                for (let i = 0; i < n; i++) {
                    let minIdx = i;
                    for (let j = i + 1; j < n; j++) {
                        this.comparisons++;
                        document.getElementById('comparisons').textContent = this.comparisons;

                        this.renderArray({ comparing: [minIdx, j], sorted: Array.from({length: i}, (_, k) => k) });
                        await this.sleep(this.animationSpeed);

                        if (this.array[j] < this.array[minIdx]) {
                            minIdx = j;
                        }
                    }

                    if (minIdx !== i) {
                        this.swaps++;
                        document.getElementById('swaps').textContent = this.swaps;

                        [this.array[i], this.array[minIdx]] = [this.array[minIdx], this.array[i]];
                        this.renderArray({ swapping: [i, minIdx] });
                        await this.sleep(this.animationSpeed);
                    }
                }
                this.renderArray({ sorted: Array.from({length: n}, (_, k) => k) });
            }

            async insertionSort() {
                const n = this.array.length;
                for (let i = 1; i < n; i++) {
                    let key = this.array[i];
                    let j = i - 1;

                    while (j >= 0) {
                        this.comparisons++;
                        document.getElementById('comparisons').textContent = this.comparisons;

                        this.renderArray({ comparing: [j, j + 1], sorted: Array.from({length: i}, (_, k) => k) });
                        await this.sleep(this.animationSpeed);

                        if (this.array[j] > key) {
                            this.swaps++;
                            document.getElementById('swaps').textContent = this.swaps;

                            this.array[j + 1] = this.array[j];
                            j--;
                        } else {
                            break;
                        }
                    }
                    this.array[j + 1] = key;
                }
                this.renderArray({ sorted: Array.from({length: n}, (_, k) => k) });
            }

            reset() {
                this.comparisons = 0;
                this.swaps = 0;
                document.getElementById('comparisons').textContent = '0';
                document.getElementById('swaps').textContent = '0';
            }

            updateAlgorithmInfo(algorithm) {
                const info = this.algorithms[algorithm];
                document.getElementById('time-complexity').textContent = info.timeComplexity;
                document.getElementById('space-complexity').textContent = info.spaceComplexity;

                const infoSection = document.getElementById('algorithm-info');
                infoSection.innerHTML = `
                    <h3>${info.name}</h3>
                    <p style="margin: 15px 0; line-height: 1.6;">${info.description}</p>
                    <pre>${info.code}</pre>
                `;
            }
        }

        // Initialize visualizer
        const visualizer = new AlgorithmVisualizer();
    </script>
</body>
</html>
