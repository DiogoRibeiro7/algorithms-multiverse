name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r docs/requirements-docs.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Docstring coverage
        run: python tools/docstring_coverage.py
      - name: Typecheck (pyright)
        run: pyright algorithms_multiverse/__init__.py algorithms_multiverse/graph.py algorithms_multiverse/mst_benchmark.py
      - name: Tests
        run: pytest advanced-data-structures/test_all.py
      - name: Build docs
        run: mkdocs build --strict
