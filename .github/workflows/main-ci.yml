name: Main CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  RUST_VERSION: 'stable'
  GO_VERSION: '1.21'
  RUBY_VERSION: '3.2'
  JULIA_VERSION: '1.9'
  SWIFT_VERSION: '5.9'
  DOTNET_VERSION: '8.0'

jobs:
  # Job to detect which files changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      javascript: ${{ steps.filter.outputs.javascript }}
      typescript: ${{ steps.filter.outputs.typescript }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      cpp: ${{ steps.filter.outputs.cpp }}
      java: ${{ steps.filter.outputs.java }}
      csharp: ${{ steps.filter.outputs.csharp }}
      ruby: ${{ steps.filter.outputs.ruby }}
      julia: ${{ steps.filter.outputs.julia }}
      swift: ${{ steps.filter.outputs.swift }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'requirements*.txt'
              - 'pyproject.toml'
            javascript:
              - '**/*.js'
              - '**/*.mjs'
              - '**/package.json'
            typescript:
              - 'typescript/**'
              - '**/*.ts'
              - '**/tsconfig.json'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
            go:
              - '**/*.go'
              - '**/go.mod'
            cpp:
              - '**/*.cpp'
              - '**/*.hpp'
              - '**/*.h'
              - '**/CMakeLists.txt'
            java:
              - '**/*.java'
              - '**/pom.xml'
              - '**/build.gradle'
            csharp:
              - 'csharp/**'
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.sln'
            ruby:
              - 'ruby/**'
              - '**/*.rb'
              - '**/Gemfile'
            julia:
              - 'julia/**'
              - '**/*.jl'
              - '**/Project.toml'
            swift:
              - 'swift/**'
              - '**/*.swift'
              - '**/Package.swift'
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'mkdocs.yml'

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install code quality tools
        run: |
          pip install --upgrade pip
          pip install black ruff mypy bandit safety
          pip install lizard  # Cyclomatic complexity

      - name: Check Python code formatting
        run: |
          black --check .
        continue-on-error: true

      - name: Lint Python code
        run: |
          ruff check .
        continue-on-error: true

      - name: Type checking
        run: |
          mypy . --ignore-missing-imports
        continue-on-error: true

      - name: Security audit
        run: |
          bandit -r . -ll -i ./tests
          safety check --json
        continue-on-error: true

      - name: Code complexity analysis
        run: |
          lizard . -l python -o complexity_report.txt
          cat complexity_report.txt
        continue-on-error: true

      - name: Upload complexity report
        uses: actions/upload-artifact@v4
        with:
          name: complexity-report
          path: complexity_report.txt

  # Python testing
  test-python:
    needs: [changes]
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist pytest-benchmark
          pip install numpy scipy networkx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        shell: bash

      - name: Run tests with coverage
        run: |
          pytest -v --cov=. --cov-report=xml --cov-report=term-missing --durations=10 -n auto
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: python-${{ matrix.python-version }}-${{ matrix.os }}
          fail_ci_if_error: false

  # TypeScript/JavaScript testing
  test-typescript:
    needs: [changes]
    if: ${{ needs.changes.outputs.typescript == 'true' || needs.changes.outputs.javascript == 'true' || github.event_name == 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['16', '18', '20']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: |
          npm ci
          npm install -g typescript ts-node jest

      - name: Build TypeScript
        working-directory: typescript
        run: npm run build
        continue-on-error: true

      - name: Run tests
        working-directory: typescript
        run: npm test -- --coverage
        continue-on-error: true

      - name: Run linting
        working-directory: typescript
        run: npm run lint
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./typescript/coverage
          flags: typescript-${{ matrix.node-version }}-${{ matrix.os }}
          fail_ci_if_error: false

  # Ruby testing
  test-ruby:
    needs: [changes]
    if: ${{ needs.changes.outputs.ruby == 'true' || github.event_name == 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby-version: ['3.0', '3.1', '3.2']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Install dependencies
        working-directory: ruby
        run: |
          gem install bundler
          bundle install
        continue-on-error: true

      - name: Run tests
        working-directory: ruby
        run: |
          bundle exec rspec --format documentation
        continue-on-error: true

      - name: Run RuboCop
        working-directory: ruby
        run: |
          gem install rubocop
          rubocop
        continue-on-error: true

  # Julia testing
  test-julia:
    needs: [changes]
    if: ${{ needs.changes.outputs.julia == 'true' || github.event_name == 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        julia-version: ['1.8', '1.9', '1.10']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v1

      - name: Install dependencies
        working-directory: julia
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
        continue-on-error: true

      - name: Run tests
        working-directory: julia
        run: |
          julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'
        continue-on-error: true

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: julia/src
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: lcov.info
          flags: julia-${{ matrix.julia-version }}-${{ matrix.os }}
          fail_ci_if_error: false

  # C# testing
  test-csharp:
    needs: [changes]
    if: ${{ needs.changes.outputs.csharp == 'true' || github.event_name == 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        working-directory: csharp
        run: dotnet restore

      - name: Build
        working-directory: csharp
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: csharp
        run: |
          dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage"
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./csharp
          flags: csharp-${{ matrix.os }}
          fail_ci_if_error: false

  # Swift testing (macOS only)
  test-swift:
    needs: [changes]
    if: ${{ needs.changes.outputs.swift == 'true' || github.event_name == 'schedule' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Swift package
        working-directory: swift
        run: swift build -v
        continue-on-error: true

      - name: Run Swift tests
        working-directory: swift
        run: swift test -v --enable-code-coverage
        continue-on-error: true

      - name: Generate coverage report
        working-directory: swift
        run: |
          xcrun llvm-cov export \
            .build/debug/AlgorithmsMultiversePackageTests.xctest/Contents/MacOS/AlgorithmsMultiversePackageTests \
            -instr-profile=.build/debug/codecov/default.profdata \
            -format=lcov > coverage.lcov
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./swift/coverage.lcov
          flags: swift-macos
          fail_ci_if_error: false

  # Documentation build and checks
  documentation:
    needs: [changes]
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install documentation tools
        run: |
          pip install mkdocs mkdocs-material mdx-include
          pip install sphinx sphinx-rtd-theme

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/markdown-link-check-config.json'
        continue-on-error: true

      - name: Build MkDocs documentation
        run: mkdocs build --strict
        continue-on-error: true

      - name: Check documentation coverage
        run: |
          python .github/scripts/check_doc_coverage.py
        continue-on-error: true

  # Final status check
  status-check:
    needs: [code-quality, test-python, test-typescript, test-ruby, test-julia, test-csharp, test-swift, documentation]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check job statuses
        run: |
          echo "CI Pipeline completed!"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Python Tests: ${{ needs.test-python.result }}"
          echo "TypeScript Tests: ${{ needs.test-typescript.result }}"
          echo "Ruby Tests: ${{ needs.test-ruby.result }}"
          echo "Julia Tests: ${{ needs.test-julia.result }}"
          echo "C# Tests: ${{ needs.test-csharp.result }}"
          echo "Swift Tests: ${{ needs.test-swift.result }}"
          echo "Documentation: ${{ needs.documentation.result }}"

          # Set exit code based on critical jobs
          if [[ "${{ needs.code-quality.result }}" == "failure" ]] || \
             [[ "${{ needs.test-python.result }}" == "failure" ]] || \
             [[ "${{ needs.test-typescript.result }}" == "failure" ]]; then
            echo "Critical jobs failed!"
            exit 1
          fi

      - name: Create status badge
        if: github.ref == 'refs/heads/main'
        run: |
          echo "[![CI Status](https://github.com/${{ github.repository }}/workflows/Main%20CI%20Pipeline/badge.svg)](https://github.com/${{ github.repository }}/actions)" > ci-status.md
        continue-on-error: true
