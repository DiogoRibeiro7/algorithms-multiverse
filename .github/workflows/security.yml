name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scan daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

jobs:
  # CodeQL analysis for multiple languages
  codeql:
    name: CodeQL Analysis
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript', 'typescript' ]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # Python security scanning
  python-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect Python project files
        id: detect
        shell: bash
        run: |
          if [[ -f pyproject.toml ]] || compgen -G "requirements*.txt" > /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          pip install --upgrade pip
          pip install bandit[toml] safety pip-audit

      - name: Install Semgrep
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          pip install semgrep
        continue-on-error: true

      - name: Run Bandit security scan
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          bandit -r . -f json -o bandit-report.json -ll -x ./tests
          bandit -r . -ll -x ./tests
        continue-on-error: true

      - name: Check for known vulnerabilities with Safety
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          safety check --json --output safety-report.json
          safety check
        continue-on-error: true

      - name: Audit dependencies with pip-audit
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          pip-audit --desc --format json --output pip-audit-report.json
          pip-audit --desc
        continue-on-error: true

      - name: Run Semgrep security patterns
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        shell: bash
        run: |
          if command -v semgrep >/dev/null 2>&1; then
            semgrep --config=auto --json --output=semgrep-report.json .
            semgrep --config=auto .
          else
            echo "Semgrep not available; skipping scan."
          fi
        continue-on-error: true

      - name: Upload security reports
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          if-no-files-found: warn
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
            semgrep-report.json

  # Node.js/TypeScript security scanning
  nodejs-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect Node.js project files
        id: detect
        shell: bash
        run: |
          if [[ -f typescript/package.json ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install security tools
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        working-directory: typescript
        run: |
          npm install --ignore-scripts
          npm install -g npm-audit-resolver snyk @microsoft/eslint-formatter-sarif
          npm install --save-dev --ignore-scripts eslint-plugin-security

      - name: Run npm audit
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        working-directory: typescript
        run: |
          npm audit --json > npm-audit-report.json || true
          npm audit || true

      - name: Run Snyk security scan
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        working-directory: typescript
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --json --file=package.json > snyk-report.json || true
          snyk test || true
        continue-on-error: true

      - name: ESLint security rules
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        working-directory: typescript
        run: |
          npx eslint . --ext .ts,.js --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-security-report.sarif || true
        continue-on-error: true

      - name: Upload security reports
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-security-reports
          if-no-files-found: warn
          path: |
            typescript/npm-audit-report.json
            typescript/snyk-report.json
            typescript/eslint-security-report.sarif

  # Container scanning
  container-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect container build file
        id: detect
        shell: bash
        run: |
          if [[ -f Dockerfile ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          docker build -t algorithms-multiverse:scanning .
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'algorithms-multiverse:scanning'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Run Grype vulnerability scanner
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype algorithms-multiverse:scanning -o json > grype-report.json
          grype algorithms-multiverse:scanning
        continue-on-error: true

      - name: Upload container scan results
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Dependency scanning for multiple languages
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect dependency manifests
        id: detect
        shell: bash
        run: |
          if [[ -f pyproject.toml || -f pom.xml || -f go.mod || -f Cargo.toml ]] || compgen -G "requirements*.txt" > /dev/null || compgen -G "package*.json" > /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OWASP Dependency Check
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'algorithms-multiverse'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
        env:
          JAVA_HOME: /opt/jdk

      - name: Upload dependency check results
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          if-no-files-found: warn
          path: reports/

  # License compliance scanning
  license-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect license scan inputs
        id: detect
        shell: bash
        run: |
          if [[ -f pyproject.toml || -f typescript/package.json ]] || compgen -G "requirements*.txt" > /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install license checkers
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          pip install pip-licenses licensecheck
          npm install -g license-checker

      - name: Check Python licenses
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          pip-licenses --format=json --output-file=python-licenses.json
          pip-licenses --fail-on="GPL;LGPL"
        continue-on-error: true

      - name: Check Node.js licenses
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        working-directory: typescript
        run: |
          npm install --ignore-scripts
          license-checker --json > ../nodejs-licenses.json
          license-checker --onlyAllow "MIT;Apache-2.0;BSD;ISC;Unlicense"
        continue-on-error: true

      - name: Check for license files
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        shell: bash
        run: |
          if [[ -f .github/scripts/check_licenses.py ]]; then
            python .github/scripts/check_licenses.py
          fi
        continue-on-error: true

      - name: Upload license reports
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          if-no-files-found: warn
          path: |
            python-licenses.json
            nodejs-licenses.json

  # Secret scanning
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run TruffleHog
        run: |
          pip install truffleHog3
          trufflehog3 --no-history --format json --output trufflehog-report.json
          trufflehog3 --no-history
        continue-on-error: true

      - name: Run detect-secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline
        continue-on-error: true

      - name: Upload secret scanning results
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          if-no-files-found: warn
          path: |
            trufflehog-report.json
            .secrets.baseline

  # SAST (Static Application Security Testing)
  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect SAST credentials
        id: detect
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "sonar=true" >> "$GITHUB_OUTPUT"
          else
            echo "sonar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run SonarCloud scan
        if: ${{ steps.detect.outputs.sonar == 'true' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # Consolidated security report
  security-report:
    needs: [codeql, python-security, nodejs-security, container-security, dependency-check, license-check, secret-scan, sast]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all security reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports/
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install report tools
        run: |
          pip install pandas jinja2 markdown

      - name: Generate consolidated security report
        shell: bash
        run: |
          if [[ -f .github/scripts/consolidate_security_reports.py && -f .github/scripts/security_summary.py ]]; then
            python .github/scripts/consolidate_security_reports.py \
              --input security-reports/ \
              --output SECURITY_REPORT.md

            python .github/scripts/security_summary.py \
              --input security-reports/ \
              --output security_summary.md
          else
            echo "# Security Report" > SECURITY_REPORT.md
            echo "Consolidation scripts are not present in this repository." >> SECURITY_REPORT.md
            echo "Security reports were uploaded as workflow artifacts." > security_summary.md
          fi

      - name: Upload final security report
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-security-report
          if-no-files-found: warn
          path: |
            SECURITY_REPORT.md
            security_summary.md

      - name: Comment on PR with security summary
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security_summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Scan Results\n\n${summary}`
            });

      - name: Create security issue if critical findings
        if: ${{ contains(needs.python-security.result, 'failure') || contains(needs.nodejs-security.result, 'failure') }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security: Critical vulnerabilities detected',
              body: 'Critical security vulnerabilities were detected in the latest scan. Please review the security report in the workflow artifacts.',
              labels: ['security', 'critical', 'automated']
            });
