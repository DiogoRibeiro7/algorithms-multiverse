name: Performance Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      language:
        description: 'Language to benchmark'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - python
          - typescript
          - rust
          - go
          - cpp
          - java
          - csharp

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark-framework:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.language == 'all' || github.event.inputs.language == 'python' || github.event.inputs.language == 'typescript' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Detect benchmark framework
        id: detect
        shell: bash
        run: |
          if [[ -f benchmarks/test_framework.py && -f benchmarks/config/config.yaml ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Use Node.js
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r benchmarks/requirements.txt
          pip install psutil pyyaml

      - name: Run benchmark framework validation
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          python benchmarks/test_framework.py | tee benchmark_framework.log

      - name: Run quick benchmark suite
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        run: |
          python -m benchmarks.framework.runner \
            --scenario quick \
            --config benchmarks/config/config.yaml \
            --algorithm simple_benchmark | tee quick_benchmark.log

      - name: Upload benchmark results
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-framework-results
          path: |
            benchmark_framework.log
            quick_benchmark.log
            benchmarks/data/benchmark_results.db
            benchmarks/results/*

  benchmark-c:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.language == 'all' || github.event.inputs.language == 'cpp' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Detect C benchmark source
        id: detect
        shell: bash
        run: |
          if [[ -f benchmarks/compare_dijkstra.c ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Dijkstra benchmark
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        working-directory: benchmarks
        run: |
          gcc -O3 -o compare_dijkstra compare_dijkstra.c -lm

      - name: Run Dijkstra benchmark
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        working-directory: benchmarks
        run: |
          ./compare_dijkstra 60 240 | tee dijkstra_benchmark.txt

      - name: Upload benchmark results
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: c-benchmark-results
          path: |
            benchmarks/dijkstra_benchmark.txt
            benchmarks/dijkstra_results.csv
            benchmarks/dijkstra_trials.csv

  # Performance comparison and reporting
  performance-report:
    needs: [benchmark-framework, benchmark-c]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: benchmarks-results

      - name: Generate workflow summary
        shell: bash
        run: |
          {
            echo "# Performance Benchmark Report"
            echo
            echo "Generated from repository benchmark assets that currently exist."
            echo
            echo "## Artifacts"
            find benchmarks-results -maxdepth 2 -type f | sort | sed 's#^#- #'
          } > performance_report.md

          {
            echo "# Regression Analysis"
            echo
            echo "Automated regression comparison is not enabled because the repository does not contain the previous baseline scripts referenced by the old workflow."
          } > regression_report.md

      - name: Comment on PR with performance results
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('performance_report.md', 'utf8');
            const regressionReport = fs.readFileSync('regression_report.md', 'utf8');

            const comment = `## 📊 Performance Benchmark Results

            ${report}

            ## ⚠️ Regression Analysis

            ${regressionReport}

            <details>
            <summary>View detailed charts</summary>

            Charts and detailed analysis are available in the workflow artifacts.
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload final reports
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: |
            performance_report.*
            regression_report.md
