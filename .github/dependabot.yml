# Dependabot configuration for automatic dependency updates
version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  # Root Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "python"
    groups:
      python-dev:
        patterns:
          - "pytest*"
          - "black"
          - "ruff"
          - "mypy"
        update-types:
          - "minor"
          - "patch"
      python-prod:
        patterns:
          - "numpy"
          - "scipy"
          - "networkx"
        update-types:
          - "minor"
          - "patch"

  # Documentation Python dependencies
  - package-ecosystem: "pip"
    directory: "/docs"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "python"
      - "documentation"

  # Benchmarks Python dependencies
  - package-ecosystem: "pip"
    directory: "/benchmarks"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "python"
      - "testing"

  # Reports Python dependencies
  - package-ecosystem: "pip"
    directory: "/reports"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "python"

  # Graph benchmark Python dependencies
  - package-ecosystem: "pip"
    directory: "/graph-algorithms"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "python"

  # JavaScript dependencies
  - package-ecosystem: "npm"
    directory: "/javascript"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "javascript"
    versioning-strategy: increase
    groups:
      javascript-dev:
        patterns:
          - "eslint*"
          - "jest*"
        update-types:
          - "minor"
          - "patch"
      javascript-prod:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/typescript"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "javascript"
      - "typescript"
    versioning-strategy: increase
    groups:
      typescript-dev:
        patterns:
          - "@types/*"
          - "typescript"
          - "eslint*"
          - "jest*"
        update-types:
          - "minor"
          - "patch"
      typescript-prod:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "rust"

  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "go"

  # Ruby dependencies
  - package-ecosystem: "bundler"
    directory: "/ruby"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "ruby"
    groups:
      ruby-all:
        update-types:
          - "minor"
          - "patch"

  # NuGet dependencies for C#
  - package-ecosystem: "nuget"
    directory: "/csharp"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "csharp"

  # Swift dependencies
  - package-ecosystem: "swift"
    directory: "/swift"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "swift"

  # Julia dependencies
  - package-ecosystem: "julia"
    directory: "/julia"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "julia"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    open-pull-requests-limit: 1
    reviewers:
      - "diogoribeiro7"
    labels:
      - "github-actions"
      - "ci/cd"
    groups:
      actions:
        patterns:
          - "actions/*"
        update-types:
          - "minor"
          - "patch"

