[package]
name = "algorithms-multiverse-rust"
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/diogoribeiro7/algorithms-multiverse"
license = "MIT"
description = "Rust algorithm implementations from the Algorithms Multiverse repository"

